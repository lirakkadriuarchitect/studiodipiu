<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact diPiù — an integrated architecture and art studio." />
  <meta name="theme-color" content="#f5f3ef" />
  <title>Contact — diPiù</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200&family=Didact+Gothic&display=swap" rel="stylesheet" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://www.studiodipiu.com/contact.html" />
  <meta property="og:title"       content="Contact — diPiù" />
  <meta property="og:description" content="Get in touch with diPiù — an integrated architecture and art studio." />
  <meta property="og:image"       content="https://www.studiodipiu.com/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Contact — diPiù" />
  <meta name="twitter:description" content="Get in touch with diPiù — an integrated architecture and art studio." />
  <meta name="twitter:image"       content="https://www.studiodipiu.com/og-image.jpg" />

  <link rel="stylesheet" href="style.css" />
  <style>
    .page {
      padding: clamp(2.5rem,6vw,5rem) clamp(2rem,7vw,7rem);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      gap: clamp(3rem,6vw,5rem);
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      opacity: 0;
      animation: fadeUp .65s cubic-bezier(.22,1,.36,1) .1s forwards;
    }
    .back {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.55rem,.9vw,.65rem);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .5em;
      transition: color .2s;
    }
    .back:hover { color: var(--ink); }
    .back-arrow { font-size: .9em; }
    .wordmark {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(1.1rem,2.2vw,1.8rem);
      letter-spacing: -.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .contact-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .contact-label {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.52rem,.82vw,.6rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: .8rem;
      opacity: 0;
      animation: fadeUp .6s cubic-bezier(.22,1,.36,1) .25s forwards;
    }
    .contact-title {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(2rem,5vw,4.5rem);
      letter-spacing: -.02em;
      line-height: 1;
      color: var(--ink);
    }
    .contact-title .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp .7s cubic-bezier(.22,1,.36,1) calc(.35s + var(--i) * .17s) forwards;
    }
    .contact-lines {
      margin-top: clamp(1.5rem,3vw,2.5rem);
      display: flex;
      flex-direction: column;
      gap: .8rem;
      opacity: 0;
      animation: fadeUp .7s cubic-bezier(.22,1,.36,1) .7s forwards;
    }
    .contact-item {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.7rem,1.1vw,.82rem);
      letter-spacing: .1em;
      color: var(--dim);
    }
    .contact-item a {
      color: inherit;
      text-decoration: none;
      transition: color .2s;
    }
    .contact-item a:hover { color: var(--ink); }

    footer {
      opacity: 0;
      animation: fadeUp .7s cubic-bezier(.22,1,.36,1) .9s forwards;
    }
  </style>
</head>
<body>

<div id="c-ring"></div>
<div id="c-dot"></div>

<div class="page">
  <header>
    <a class="back" href="index.html"><span class="back-arrow">←</span> back</a>
    <a class="wordmark" href="index.html">diPiù</a>
  </header>

  <main class="contact-wrap">
    <p class="contact-label">Studio</p>
    <h1 class="contact-title">
      <span class="word" style="--i:0">Get in</span><br>
      <span class="word" style="--i:1">touch</span>
    </h1>
    <div class="contact-lines">
      <p class="contact-item"><a href="mailto:info@studiodipiu.com">info@studiodipiu.com</a></p>
      <p class="contact-item"><a href="https://www.instagram.com/studiodipiu" target="_blank" rel="noopener">Instagram</a></p>
      <p class="contact-item"><a href="https://www.linkedin.com/company/studiodipiu" target="_blank" rel="noopener">LinkedIn</a></p>
    </div>
  </main>

  <footer>
    <span>www.studiodipiu.com</span>
    <div class="footer-social">
      <a href="https://www.instagram.com/studiodipiu" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
      <a href="https://www.linkedin.com/company/studiodipiu" target="_blank" rel="noopener" aria-label="LinkedIn">LinkedIn</a>
    </div>
    <a href="mailto:info@studiodipiu.com">info@studiodipiu.com</a>
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>
