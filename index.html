<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diPiù</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200&family=Didact+Gothic&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f3ef;
      --ink: #181614;
      --dim: rgba(24,22,20,0.36);
      --line: rgba(24,22,20,0.13);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2.5rem, 6vw, 5rem) clamp(2rem, 7vw, 7rem);
    }

    .main {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ══════════════════════════════════════════
       WORDMARK
       Each character slides up from a clip mask,
       staggered left-to-right like ink pressing
       into paper — a letterpress reveal.
    ══════════════════════════════════════════ */
    .wordmark {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(3rem, 9vw, 8.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
      display: flex;
      overflow: hidden; /* clip the rising chars */
    }

    .wordmark .char {
      display: inline-block;
      transform: translateY(110%);
      animation: charRise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* stagger each character */
    .wordmark .char:nth-child(1)  { animation-delay: 0.05s; }
    .wordmark .char:nth-child(2)  { animation-delay: 0.12s; }
    .wordmark .char:nth-child(3)  { animation-delay: 0.19s; }
    .wordmark .char:nth-child(4)  { animation-delay: 0.26s; }
    .wordmark .char:nth-child(5)  { animation-delay: 0.33s; }
    .wordmark .char:nth-child(6)  { animation-delay: 0.40s; }

    @keyframes charRise {
      to { transform: translateY(0); }
    }

    /* ══════════════════════════════════════════
       TAGLINE
       Fades in + rises after wordmark settles
    ══════════════════════════════════════════ */
    .tagline {
      margin-top: clamp(0.9rem, 2vw, 1.6rem);
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(0.75rem, 1.4vw, 0.95rem);
      letter-spacing: 0.08em;
      color: var(--dim);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.75s forwards;
    }

    /* ══════════════════════════════════════════
       DISCIPLINES
       Label fades in first, then the track
       does a horizontal wipe-in
    ══════════════════════════════════════════ */
    .disciplines {
      margin-top: clamp(2.5rem, 5vw, 4rem);
    }

    .discipline-label {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(0.52rem, 0.82vw, 0.6rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 0.65rem;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.22,1,0.36,1) 1s forwards;
    }

    .discipline-track {
      position: relative;
      height: clamp(1.6rem, 3vw, 2.4rem);
      overflow: hidden;
    }

    /* Wipe-in underline that draws across before first word appears */
    .discipline-track::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      height: 1px;
      width: 0;
      background: var(--ink);
      opacity: 0.18;
      animation: lineExpand 0.7s cubic-bezier(0.76,0,0.24,1) 1.1s forwards;
    }

    @keyframes lineExpand {
      to { width: 100%; }
    }

    .discipline-track span {
      position: absolute;
      inset: 0;
      font-family: 'Jost', sans-serif;
      font-weight: 100;
      font-size: clamp(1.1rem, 2.6vw, 2rem);
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      color: var(--ink);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .discipline-track span.active { opacity: 1; transform: translateY(0); }
    .discipline-track span.exit   { opacity: 0; transform: translateY(-10px); }

    /* ══════════════════════════════════════════
       FOOTER
       Slides up last, border draws in from left
    ══════════════════════════════════════════ */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      padding-top: 1.8rem;
      position: relative;
    }

    /* Animated top border */
    footer::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      height: 1px;
      width: 0;
      background: var(--line);
      /* Wait until page is settled */
      animation: lineExpand 0.9s cubic-bezier(0.76,0,0.24,1) 1.6s forwards;
    }

    footer {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(0.55rem, 0.92vw, 0.65rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 1.5s forwards;
    }
    footer a { color: inherit; text-decoration: none; transition: color 0.25s; }
    footer a:hover { color: var(--ink); }

    /* ══════════════════════════════════════════
       HOVER — wordmark chars lift slightly
    ══════════════════════════════════════════ */
    .wordmark:hover .char {
      animation: none;
      transform: translateY(0);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .wordmark:hover .char:nth-child(1) { transform: translateY(-4px); transition-delay: 0.00s; }
    .wordmark:hover .char:nth-child(2) { transform: translateY(-4px); transition-delay: 0.04s; }
    .wordmark:hover .char:nth-child(3) { transform: translateY(-4px); transition-delay: 0.08s; }
    .wordmark:hover .char:nth-child(4) { transform: translateY(-4px); transition-delay: 0.12s; }
    .wordmark:hover .char:nth-child(5) { transform: translateY(-4px); transition-delay: 0.16s; }
    .wordmark:hover .char:nth-child(6) { transform: translateY(-4px); transition-delay: 0.20s; }

    /* ══════════════════════════════════════════
       SHARED KEYFRAMES
    ══════════════════════════════════════════ */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      footer { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
    }
  </style>
</head>
<body>
<div class="page">
  <main class="main">

    <!--
      Each character wrapped in .char for individual stagger animation.
      Using non-breaking space between "di" and "Più" so it never breaks.
    -->
    <h1 class="wordmark" aria-label="diPiù">
      <span class="char">d</span><span class="char">i</span><span class="char">P</span><span class="char">i</span><span class="char">ù</span>
    </h1>

    <p class="tagline">An integrated architecture and art studio.</p>

    <div class="disciplines">
      <p class="discipline-label">Practice</p>
      <div class="discipline-track" aria-live="polite">
        <span>architecture</span>
        <span>interior design</span>
        <span>art</span>
      </div>
    </div>

  </main>

  <footer>
    <span>www.studiodipiu.com</span>
    <a href="mailto:info@studiodipiu.com">info@studiodipiu.com</a>
  </footer>
</div>

<script>
  (function () {
    const items = document.querySelectorAll('.discipline-track span');
    let current = 0;

    function activate(idx) {
      items.forEach((el, i) => {
        el.classList.remove('active', 'exit');
        if (i === idx) el.classList.add('active');
        else if (i === (idx - 1 + items.length) % items.length) el.classList.add('exit');
      });
    }

    // First word appears after the underline draws in
    setTimeout(() => {
      activate(0);
      setInterval(() => {
        current = (current + 1) % items.length;
        activate(current);
      }, 2800);
    }, 1800);
  })();
</script>
</body>
</html>
