<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="diPiù — An integrated architecture and art studio." />
  <meta name="theme-color" content="#f5f3ef" />
  <title>diPiù</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200&family=Didact+Gothic&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f3ef;
      --ink: #181614;
      --dim: rgba(24,22,20,0.36);
      --line: rgba(24,22,20,0.13);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── CURSOR ── */
    #c-dot, #c-ring {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    #c-dot { width: 5px; height: 5px; background: var(--ink); }
    #c-ring {
      width: 30px; height: 30px;
      border: 1px solid rgba(24,22,20,0.38);
      transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease;
    }

    /* PAGE LAYOUT */
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2.5rem, 6vw, 5rem)
               clamp(2rem, 7vw, 7rem)
               clamp(2.5rem, 6vw, 5rem)
               clamp(2rem, 7vw, 7rem);
    }

    .main {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ── WORDMARK — "di" then "Più" ── */
    .wordmark {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(3rem, 9vw, 8.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
    }

    .wm-di {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) 0.9s forwards;
    }

    .wm-piu {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.65s cubic-bezier(0.22,1,0.36,1) 1.75s forwards;
    }

    .tagline {
      margin-top: clamp(0.9rem, 2vw, 1.6rem);
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(0.75rem, 1.4vw, 0.95rem);
      letter-spacing: 0.08em;
      color: var(--dim);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 2.4s forwards;
    }

    .disciplines {
      margin-top: clamp(2.5rem, 5vw, 4rem);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 3.0s forwards;
    }

    .discipline-label {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(0.52rem, 0.82vw, 0.6rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 0.65rem;
    }

    .discipline-track {
      position: relative;
      height: clamp(1.6rem, 3vw, 2.4rem);
      overflow: hidden;
    }

    .discipline-track span {
      position: absolute;
      inset: 0;
      font-family: 'Jost', sans-serif;
      font-weight: 100;
      font-size: clamp(1.1rem, 2.6vw, 2rem);
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      color: var(--ink);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }
    .discipline-track span.active { opacity: 1; transform: translateY(0); }
    .discipline-track span.exit   { opacity: 0; transform: translateY(-10px); }

    /* ── FOOTER ── */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      padding-top: 1.8rem;
      border-top: 1px solid var(--line);
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(0.55rem, 0.92vw, 0.65rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 3.6s forwards;
    }
    footer a { color: inherit; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--ink); }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* ── ACCENT MARK on "ù" in Più ── */
    .wm-accent-wrap {
      position: relative;
      display: inline-block;
    }
    .wm-accent-mark {
      position: absolute;
      top: -0.1em;
      left: 0.08em;
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: inherit;
      line-height: 1;
      color: var(--ink);
      display: inline-block;
      transform-origin: center bottom;
      opacity: 0;
      animation:
        accentFadeIn 0.35s ease-out 2.15s forwards,
        accentShake  6s   ease-in-out 4s infinite;
    }
    @keyframes accentFadeIn { to { opacity: 1; } }
    @keyframes accentShake {
      0%,  18%, 100% { transform: translateX(0)    rotate(0deg);   }
      3%             { transform: translateX(-3px)  rotate(-10deg); }
      6%             { transform: translateX( 3px)  rotate( 10deg); }
      9%             { transform: translateX(-2px)  rotate( -7deg); }
      12%            { transform: translateX( 2px)  rotate(  7deg); }
      15%            { transform: translateX(-1px)  rotate( -3deg); }
      17%            { transform: translateX(0)     rotate(  0deg); }
    }

    /* ── MOBILE ── */
    @media (max-width: 680px) {
      html, body { cursor: auto; }
      #c-dot, #c-ring { display: none; }
      footer { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
    }
  </style>
</head>
<body>

<div id="c-ring"></div>
<div id="c-dot"></div>

<div class="page">
  <main class="main">
    <h1 class="wordmark">
      <span class="wm-di">di</span><span class="wm-piu">Pi<span class="wm-accent-wrap">u<span class="wm-accent-mark" aria-hidden="true">`</span></span></span>
    </h1>
    <p class="tagline">An integrated architecture and art studio.</p>

    <div class="disciplines">
      <p class="discipline-label">Practice</p>
      <div class="discipline-track" aria-live="polite">
        <span>architecture</span>
        <span>interior design</span>
        <span>art</span>
      </div>
    </div>
  </main>

  <footer>
    <span>www.studiodipiu.com</span>
    <a href="mailto:info@studiodipiu.com">info@studiodipiu.com</a>
  </footer>
</div>


<script>
  /* ── Discipline rotator — starts after disciplines have faded in ── */
  (function () {
    const items = document.querySelectorAll('.discipline-track span');
    let current = 0;
    function activate(i) {
      items.forEach((el, j) => {
        el.classList.remove('active', 'exit');
        if (j === i) el.classList.add('active');
        else if (j === (i - 1 + items.length) % items.length) el.classList.add('exit');
      });
    }
    setTimeout(() => {
      activate(0);
      setInterval(() => {
        current = (current + 1) % items.length;
        activate(current);
      }, 2800);
    }, 3800);
  })();

  /* ── Custom cursor ── */
  (function () {
    if (window.matchMedia('(pointer: coarse)').matches) return;
    const dot  = document.getElementById('c-dot');
    const ring = document.getElementById('c-ring');
    let mx = -200, my = -200, rx = -200, ry = -200;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top  = my + 'px';
    });

    (function loop() {
      rx += (mx - rx) * 0.1;
      ry += (my - ry) * 0.1;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(loop);
    })();

    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => {
        ring.style.width  = '46px';
        ring.style.height = '46px';
        ring.style.borderColor = 'rgba(24,22,20,0.6)';
      });
      el.addEventListener('mouseleave', () => {
        ring.style.width  = '30px';
        ring.style.height = '30px';
        ring.style.borderColor = 'rgba(24,22,20,0.38)';
      });
    });
  })();


</script>
</body>
</html>
