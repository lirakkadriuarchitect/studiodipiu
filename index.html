<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="diPiù — An integrated architecture and art studio." />
  <meta name="theme-color" content="#f5f3ef" />
  <title>diPiù — Architecture &amp; Art Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200&family=Didact+Gothic&display=swap" rel="stylesheet" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://www.studiodipiu.com/" />
  <meta property="og:title"       content="diPiù — Architecture &amp; Art Studio" />
  <meta property="og:description" content="An integrated architecture and art studio." />
  <meta property="og:image"       content="https://www.studiodipiu.com/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="diPiù — Architecture &amp; Art Studio" />
  <meta name="twitter:description" content="An integrated architecture and art studio." />
  <meta name="twitter:image"       content="https://www.studiodipiu.com/og-image.jpg" />

  <link rel="stylesheet" href="style.css" />
  <style>
    /* PAGE LAYOUT */
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(2.5rem, 6vw, 5rem)
               clamp(2rem, 7vw, 7rem)
               clamp(2.5rem, 6vw, 5rem)
               clamp(2rem, 7vw, 7rem);
    }

    .main {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ── WORDMARK — "di" then "Più" ── */
    .wordmark {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(3rem, 9vw, 8.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
    }

    .wm-di {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .wm-piu {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .tagline {
      margin-top: clamp(0.9rem, 2vw, 1.6rem);
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(0.75rem, 1.4vw, 0.95rem);
      letter-spacing: 0.08em;
      color: var(--dim);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.6s forwards;
    }

    .disciplines {
      margin-top: clamp(2.5rem, 5vw, 4rem);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 0s forwards;
    }

    .discipline-track {
      display: flex;
      flex-direction: column;
      gap: 0.1em;
    }

    .discipline-item {
      font-family: 'Jost', sans-serif;
      font-weight: 100;
      font-size: clamp(1.1rem, 2.6vw, 2rem);
      letter-spacing: 0.01em;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.2;
      transition: opacity 0.5s ease;
    }
    .discipline-item.is-active { opacity: 1; }
    .discipline-item:hover     { opacity: 0.65; }

    /* Footer animation (page-specific timing) */
    footer {
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) 1.4s forwards;
    }

    /* ── ACCENT MARK on "ù" in Più ── */
    .wm-accent-wrap {
      position: relative;
      display: inline-block;
    }
    .wm-accent-mark {
      position: absolute;
      top: -0.1em;
      left: 0.08em;
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: inherit;
      line-height: 1;
      color: var(--ink);
      display: inline-block;
      transform-origin: center bottom;
      opacity: 0;
      animation: accentFadeIn 0.3s ease-out 0.5s forwards;
    }
    .wm-accent-mark.shake {
      animation: accentShake 0.6s ease-in-out;
    }
    @keyframes accentFadeIn { to { opacity: 1; } }
    @keyframes accentShake {
      0%, 100% { transform: translateX(0)    rotate(0deg);   }
      15%      { transform: translateX(-3px)  rotate(-10deg); }
      30%      { transform: translateX( 3px)  rotate( 10deg); }
      50%      { transform: translateX(-2px)  rotate( -7deg); }
      70%      { transform: translateX( 2px)  rotate(  7deg); }
      85%      { transform: translateX(-1px)  rotate( -3deg); }
    }

    /* ── MOBILE ── */
    @media (max-width: 680px) {
      .footer-social { gap: 0.8em; }
    }
  </style>
</head>
<body>

<div id="c-ring"></div>
<div id="c-dot"></div>

<div class="page">
  <main class="main">
    <h1 class="wordmark">
      <span class="wm-di">di</span><span class="wm-piu">Pi<span class="wm-accent-wrap">u<span class="wm-accent-mark" aria-hidden="true">`</span></span></span>
    </h1>
    <p class="tagline">An integrated architecture and art studio.</p>

    <div class="disciplines">
      <nav class="discipline-track" aria-label="Disciplines">
        <a href="architecture.html"    class="discipline-item">architecture</a>
        <a href="interior-design.html" class="discipline-item">interior design</a>
        <a href="product-design.html"  class="discipline-item">product design</a>
        <a href="art.html"             class="discipline-item">art</a>
      </nav>
    </div>
  </main>

  <footer>
    <span>www.studiodipiu.com</span>
    <div class="footer-social">
      <a href="https://www.instagram.com/studiodipiu" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
      <a href="https://www.linkedin.com/company/studiodipiu" target="_blank" rel="noopener" aria-label="LinkedIn">LinkedIn</a>
    </div>
    <a href="mailto:info@studiodipiu.com">info@studiodipiu.com</a>
  </footer>
</div>


<script src="main.js"></script>
<script>
  /* ── Discipline focus rotator + accent shake ── */
  (function () {
    const items  = document.querySelectorAll('.discipline-item');
    const accent = document.querySelector('.wm-accent-mark');
    let current  = 0;
    let paused   = false;

    /* Lock opacity after fade-in so shake can override cleanly */
    setTimeout(() => { if (accent) accent.style.opacity = '1'; }, 900);

    function shake() {
      if (!accent) return;
      accent.classList.remove('shake');
      void accent.offsetWidth;
      accent.classList.add('shake');
    }

    function activate(i) {
      items.forEach((el, j) => el.classList.toggle('is-active', j === i));
    }

    /* Hover: user takes control */
    items.forEach((el, i) => {
      el.addEventListener('mouseenter', () => {
        paused = true;
        activate(i);
      });
      el.addEventListener('mouseleave', () => {
        paused = false;
        current = i; /* resume rotation from this item */
      });
    });

    setTimeout(() => {
      activate(0);
      setInterval(() => {
        if (paused) return;
        current = (current + 1) % items.length;
        activate(current);
        shake();
      }, 2800);
    }, 1800);
  })();
</script>
</body>
</html>
