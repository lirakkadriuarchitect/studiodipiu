  <style>
    /* ── LOCK PAGE: no body scroll on this page ── */
    html, body { height: 100vh; overflow: hidden; overscroll-behavior: none; }

    /* ── GALLERY: exactly one viewport, scroll captured by JS ── */
    .gallery-section {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .gallery-section header {
      flex-shrink: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: clamp(2rem,5vw,4rem) clamp(2rem,7vw,7rem) 0;
      opacity: 0;
      animation: fadeUp .5s cubic-bezier(.22,1,.36,1) .05s forwards;
    }
    .back {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.55rem,.9vw,.65rem);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .5em;
      transition: color .2s;
    }
    .back:hover { color: var(--ink); }
    .wordmark {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(1.1rem,2.2vw,1.8rem);
      letter-spacing: -.02em;
      color: var(--ink);
      text-decoration: none;
    }

    /* ── IMAGE STAGE ── */
    .image-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: clamp(1rem,2vw,1.8rem) clamp(2rem,7vw,7rem);
      opacity: 0;
      animation: fadeUp .6s cubic-bezier(.22,1,.36,1) .2s forwards;
    }

    /* all images stacked; each fades in/out with a subtle vertical shift */
    .art-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition:
        opacity   .5s cubic-bezier(.4,0,.2,1),
        transform .5s cubic-bezier(.22,1,.36,1);
    }

    /* entering from below (default / scrolling down) */
    .art-img.will-enter      { transform: translateY(14px); }
    /* entering from above (scrolling up) */
    .art-img.will-enter-up   { transform: translateY(-14px); }
    /* visible */
    .art-img.is-visible      { opacity: 1; transform: translateY(0); }
    /* exiting upward (scrolling down) */
    .art-img.is-exit-up      { opacity: 0; transform: translateY(-14px); }
    /* exiting downward (scrolling up) */
    .art-img.is-exit-down    { opacity: 0; transform: translateY(14px); }

    /* ── BOTTOM BAR ── */
    .gallery-foot {
      flex-shrink: 0;
      padding: 0 clamp(2rem,7vw,7rem) clamp(2rem,5vw,4rem);
      opacity: 0;
      animation: fadeUp .5s cubic-bezier(.22,1,.36,1) .35s forwards;
    }

    .g-bar {
      height: 1px;
      background: var(--line);
      overflow: hidden;
      margin-bottom: clamp(.9rem,1.8vw,1.4rem);
    }
    .g-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--ink);
      opacity: .28;
      transition: width .4s cubic-bezier(.22,1,.36,1);
    }

    .g-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
    }

    .g-label {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.52rem,.82vw,.6rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: .3rem;
    }
    .g-title {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(1.4rem,3vw,2.6rem);
      letter-spacing: -.02em;
      line-height: 1;
      color: var(--ink);
    }

    /* large ghost index — purely decorative */
    .g-index {
      font-family: 'Jost', sans-serif;
      font-weight: 100;
      font-size: clamp(3rem,7vw,6rem);
      letter-spacing: -.04em;
      line-height: 1;
      color: var(--ink);
      opacity: .1;
      text-align: center;
      transition: opacity .2s;
    }

    .g-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .35rem;
    }
    .g-count {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.52rem,.82vw,.6rem);
      letter-spacing: .18em;
      color: var(--dim);
    }
    .g-count .cur {
      color: var(--ink);
      display: inline-block;
      transition: opacity .18s;
    }
    .g-hint {
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.52rem,.82vw,.6rem);
      letter-spacing: .14em;
      color: var(--dim);
      transition: opacity .4s;
    }
    .g-hint.gone { opacity: 0; }

    /* ── FOOTER LINKS row inside bottom bar ── */
    .g-links {
      display: flex;
      justify-content: space-between;
      margin-top: .65rem;
      font-family: 'Didact Gothic', sans-serif;
      font-size: clamp(.48rem,.72vw,.55rem);
      letter-spacing: .1em;
      color: var(--dim);
    }
    .g-links a { color: inherit; text-decoration: none; transition: color .2s; }
    .g-links a:hover { color: var(--ink); }

    /* ── MOBILE: swipe-driven, no wheel capture ── */
    @media (max-width: 680px) {
      html, body { overflow: hidden; }
      .g-index { display: none; }
      .g-row   { grid-template-columns: 1fr auto; }
      .g-links { flex-wrap: wrap; gap: .4rem .8rem; justify-content: flex-start; }
    }
  </style>

<script src="main.js"></script>
<script>
(function () {
  const images  = Array.from(document.querySelectorAll('.art-img'));
  const fill    = document.getElementById('gFill');
  const curEl   = document.getElementById('gCur');
  const indexEl = document.getElementById('gIndex');
  const hint    = document.getElementById('gHint');
  const total   = images.length;

  let idx        = 0;       // current image index
  let busy       = false;   // true while a gesture is in progress
  let wheelTimer = null;    // trailing debounce timer
  let hintGone   = false;

  function pad(n) { return String(n + 1).padStart(2, '0'); }

  /* ── Show image, direction: 1 = forward (down), -1 = backward (up) ── */
  function show(newIdx, dir) {
    if (newIdx === idx) return;
    const prev = images[idx];
    const next = images[newIdx];

    // Position incoming image off-screen in the direction it arrives from
    next.classList.remove('will-enter', 'will-enter-up', 'is-visible', 'is-exit-up', 'is-exit-down');
    next.classList.add(dir > 0 ? 'will-enter' : 'will-enter-up');

    // Force reflow so the starting position is applied before transition
    void next.offsetWidth;

    // Animate outgoing
    prev.classList.remove('is-visible');
    prev.classList.add(dir > 0 ? 'is-exit-up' : 'is-exit-down');

    // Animate incoming
    next.classList.remove('will-enter', 'will-enter-up');
    next.classList.add('is-visible');

    idx = newIdx;

    // Counter
    curEl.style.opacity = '0';
    setTimeout(() => { curEl.textContent = pad(idx); curEl.style.opacity = '1'; }, 120);
    indexEl.textContent = pad(idx);

    // Progress bar
    fill.style.width = ((idx / (total - 1)) * 100) + '%';
  }

  /* ── Advance / retreat ── */
  function step(dir) {
    if (dir > 0 && idx === total - 1) return;
    if (dir < 0 && idx === 0)         return;

    show(idx + dir, dir);

    if (!hintGone) { hint.classList.add('gone'); hintGone = true; }
  }

  /* ── Wheel: trailing debounce so one gesture = one image change ──
     The first event in a gesture fires immediately; busy stays true
     until 260 ms after the last event in that gesture.              */
  window.addEventListener('wheel', (e) => {
    e.preventDefault();

    if (!busy) {
      step(e.deltaY > 0 ? 1 : -1);
      busy = true;
    }

    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { busy = false; }, 260);
  }, { passive: false, capture: true });

  /* ── Keyboard ── */
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); step(1);  }
    if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  { e.preventDefault(); step(-1); }
  });

  /* ── Touch ── */
  let touchY0 = 0;
  let touchActive = false;
  window.addEventListener('touchstart', (e) => {
    touchY0 = e.touches[0].clientY;
    touchActive = true;
  }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (!touchActive) return;
    touchActive = false;
    const dy = touchY0 - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 40) step(dy > 0 ? 1 : -1);
  }, { passive: true });

  /* ── Init: show first image ── */
  images[0].classList.add('is-visible');
  fill.style.width = '0%';
})();
</script>
